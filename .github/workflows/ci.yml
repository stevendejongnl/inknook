name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      working-directory: backend
      run: uv sync --all-extras

    - name: Run pytest
      working-directory: backend
      run: uv run pytest --cov=src --cov-fail-under=65 --cov-report=xml

    - name: Run ruff linter
      working-directory: backend
      run: uv run ruff check src tests

    - name: Run mypy type checker
      working-directory: backend
      run: uv run mypy src || true  # TODO: fix type errors after initial deploy

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: backend/coverage.xml
        fail_ci_if_error: false

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install python-semantic-release
      run: pip install python-semantic-release

    - name: Run semantic release
      id: release
      working-directory: backend
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: semantic-release version

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: main

    - name: Get version from pyproject.toml
      id: version
      working-directory: backend
      run: |
        VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: backend
        push: true
        # Kept after Keel was decommissioned (2026-09-28): nothing polls manifests now,
        # but plain manifests stay the simpler artifact and changing this is unrelated churn.
        provenance: false
        tags: |
          ghcr.io/stevendejongnl/inknook-backend:latest
          ghcr.io/stevendejongnl/inknook-backend:${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k8s
    runs-on: [self-hosted, k8s]
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.version != ''
    steps:
      # CI previously stopped at the image push and Keel pulled it into the cluster. Keel
      # was decommissioned on 2026-09-28, so without this a release is built and published
      # but never deployed.
      #
      # Sets the image as well as restarting: the deployment pins an immutable version tag,
      # so restarting alone re-pulls the identical image.
      #
      # Auth is the runner pod's own ServiceAccount token, which holds only get+patch on
      # apps/deployments via the ci-runner-deploy ClusterRole. No kubeconfig in CI.
      - name: Set image and restart deployment
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          RESTART_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          curl -sf -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            --cacert "$CA" \
            "https://kubernetes.default.svc/apis/apps/v1/namespaces/inknook-backend/deployments/inknook-backend" \
            -d "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$RESTART_AT\"}},\"spec\":{\"containers\":[{\"name\":\"inknook-backend\",\"image\":\"ghcr.io/stevendejongnl/inknook-backend:${VERSION}\"}]}}}}"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.35.0
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif
